name: ✨ Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        For larger changes, it is worth discussing the idea on [Zulip](https://taskist.zulipchat.com/#narrow/channel/539614-dev) first, so effort is not spent on something that does not fit the project's direction.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are running into, rather than the solution.
      placeholder: "When managing sprints, I cannot ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including any workarounds you are currently using.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Backlog / Tasks
        - Sprints
        - Projects & Clients
        - Users, Roles & Permissions
        - Reporting & Export
        - Notifications & Email
        - Localization
        - Deployment & Configuration
        - Other / Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - label: I would be willing to submit a pull request for this

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
